<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carnet de notes</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Carnet">
    <link rel="icon" type="image/png" sizes="192x192" href="app/icons/icon-192.png">
    <link rel="apple-touch-icon" href="app/icons/apple-touch-icon.png">
    <!-- Bibliothèques, police et son de piano sont dans le dossier app/ (vendor, fonts, sounds) : rien n'est chargé depuis Internet,
         l'appli peut donc fonctionner hors ligne (voir sw.js et app/offline.js). -->
    <link rel="stylesheet" href="app/style.css">
</head>
<body>

<div id="cn-shell">

    <header class="cn-header">
        <div class="cn-row">
            <span class="cn-brand">Carnet de notes</span>
            <div class="cn-group" role="group" aria-label="Historique">
                <button type="button" id="cn-undo" class="cn-btn cn-ico" onclick="app.undo()" title="Annuler (⌘Z)" aria-label="Annuler" disabled>↶</button>
                <button type="button" id="cn-redo" class="cn-btn cn-ico" onclick="app.redo()" title="Rétablir (⌘⇧Z)" aria-label="Rétablir" disabled>↷</button>
            </div>
            <div class="cn-title-wrap">
                <input id="cn-title" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Titre du carnet" aria-label="Titre du carnet"
                       title="Titre du carnet — c'est aussi le nom de sa sauvegarde (Entrée pour valider, Échap pour annuler)">
                <button type="button" id="cn-save" class="cn-save" onmousedown="event.preventDefault()" onclick="app.saveCurrent()" title="Sauvegarder le carnet (⌘S)" aria-label="Sauvegarder le carnet" data-sync="off">
                    <svg class="cn-save-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    <svg class="cn-save-ok" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
            </div>
            <div class="cn-group cn-files" role="group" aria-label="Carnets">
                <button type="button" class="cn-btn" onclick="app.newDocument()" title="Nouveau carnet">Nouveau</button>
                <button type="button" class="cn-btn" onclick="app.openSavedMenu(this)" title="Ouvrir un carnet sauvegardé dans ce navigateur" aria-haspopup="true">Ouvrir ▾</button>
                <button type="button" class="cn-btn" onclick="app.exportFile()" title="Exporter le carnet en fichier .json">Exporter</button>
                <button type="button" class="cn-btn" onclick="document.getElementById('cn-import-file').click()" title="Importer un fichier .json (carnet, ou grille exportée de Chord Scales)">Importer</button>
            </div>
        </div>
        <div class="cn-row cn-play" role="group" aria-label="Réglages de lecture de tous les blocs">
            <span class="cn-play-label" title="Changer un de ces réglages l'applique aussitôt à tous les blocs (portées et accords) de toutes les pages. Chaque bloc peut ensuite avoir les siens ; un nouveau bloc reprend ceux du dernier bloc créé.">Tous les blocs</span>
            <label class="cn-field" title="Tempo de tous les blocs, en noires par minute (un bloc peut ensuite avoir le sien)">
                <span>♩ =</span>
                <input id="cn-bpm" type="number" min="30" max="300" step="1" inputmode="numeric" aria-label="Tempo, en noires par minute" value="100">
            </label>
            <label class="cn-field" title="Swing de tous les blocs : 50 % = croches droites, 67 % = triolet (un bloc peut ensuite avoir le sien)">
                <span>Swing</span>
                <select id="cn-swing" aria-label="Swing de lecture">
                    <option value="50">Droit · 50 %</option><option value="55">55 %</option><option value="60">60 %</option><option value="65">65 %</option>
                    <option value="67">Triolet · 67 %</option><option value="70">70 %</option><option value="75">75 %</option>
                </select>
            </label>
            <label class="cn-field" title="Instrument transpositeur de tous les blocs : la hauteur écrite est transposée à la lecture (un bloc peut ensuite avoir le sien)">
                <span>Instrument</span>
                <select id="cn-instr" aria-label="Instrument transpositeur">
                    <option value="C">En Ut</option><option value="Bb">En Si♭</option><option value="Eb">En Mi♭</option>
                </select>
            </label>
        </div>
    </header>

    <nav id="cn-tabs" class="cn-tabs" role="tablist" aria-label="Pages du carnet"></nav>

    <main id="cn-stage" class="cn-stage"></main>

</div>

<input type="file" id="cn-import-file" class="cn-hidden" accept=".json,application/json" aria-hidden="true" tabindex="-1">

<script src="app/vendor/soundfont-player.min.js"></script>
<script src="app/vendor/vexflow-petaluma.js"></script>
<script src="app/audio/local-soundfonts.js"></script>
<script src="app/ui/staff-notes.js"></script>
<script src="app/theory.js"></script>
<script src="app/ui/chord-notes.js"></script>
<script src="app/ui/draw-notes.js"></script>
<script src="app/carnet/carnet-format.js"></script>
<script src="app/ui/staff-editor.js"></script>
<script src="app/ui/text-frame.js"></script>
<script src="app/ui/annot-canvas.js"></script>
<script src="app/ui/chord-picker.js"></script>
<script src="app/ui/chord-block.js"></script>
<script src="app/ui/draw-block.js"></script>
<script src="app/ui/annot-bar.js"></script>
<script src="app/carnet/carnet-history.js"></script>
<script src="app/carnet/carnet-sync.js"></script>
<script src="app/carnet/carnet-engine.js"></script>
<script src="app/awake.js"></script>
<script src="app/offline.js"></script>
</body>
</html>
